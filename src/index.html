<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Zyppi Admin</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#673ab7" />
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Sora:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link id="z-theme" rel="stylesheet" href="theme-light.css" />
    <script>
      // Apply the saved theme before first paint (no light flash in dark mode).
      (function () {
        var mode = 'system';
        try {
          mode = localStorage.getItem('zyppi-admin.theme') || 'system';
        } catch (e) {}
        var dark =
          mode === 'dark' ||
          (mode === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) {
          document.documentElement.classList.add('z-dark');
          document.getElementById('z-theme').setAttribute('href', 'theme-dark.css');
        }
      })();
    </script>
  </head>
  <body>
    <z-root></z-root>
  </body>
</html>
